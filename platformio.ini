[env]
monitor_speed = 115200

[env:leaf]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<*>
    -<controller_main.cpp>

[env:controller]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<*>
    -<leaf_main.cpp>

[env:native]
platform = native
test_framework = unity
build_flags =
    -DNATIVE_BUILD
build_src_filter =
    +<native_stub.cpp>

[env:controller-classic]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -UARDUINO_USB_CDC_ON_BOOT
build_src_filter =
    +<*>
    -<leaf_main.cpp>
