[env]
monitor_speed = 115200

[env:leaf]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<*>
    -<controller_main.cpp>
lib_deps =
    https://github.com/speendo/parasol/releases/download/v0.6.3/parasol-v0.6.3.tar.gz
    esp32async/ESPAsyncWebServer@^3.12
lib_ignore = AsyncTCP_RP2040W
lib_ldf_mode = deep+
extra_scripts = pre:scripts/parasol_setup.py

[env:controller]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<*>
    -<leaf_main.cpp>
lib_deps =
    https://github.com/speendo/parasol/releases/download/v0.6.3/parasol-v0.6.3.tar.gz
    esp32async/ESPAsyncWebServer@^3.12
lib_ignore = AsyncTCP_RP2040W
lib_ldf_mode = deep+
extra_scripts = pre:scripts/parasol_setup.py

[env:native]
platform = native
test_framework = unity
build_flags =
    -DNATIVE_BUILD
build_src_filter =
    +<native_stub.cpp>

[env:controller-classic]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -UARDUINO_USB_CDC_ON_BOOT
build_src_filter =
    +<*>
    -<leaf_main.cpp>
